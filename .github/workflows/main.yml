name: CI

# We can specify which Github events will trigger a CI build
on: push

# now define a single job 'build' (but could define more)
jobs:
  
  build:
    
    # we can also specify the OS to run tests on 
    runs-on: windows-latest

    # a job is a sequence of steps
    steps:

      # Next we need to chekout our repository and set up Python
      # A 'name' is just an optional label shown in the log 
      -name: Checkout repository
       uses: actions/checkout@v7

      -name: Set up Python 3.14
       uses: actions/setup-python@v7
       with:
         python-version: "3.14"
      
      -name: Install Python dependencies
       run: |
         python -m pip install --upgrade pip
         python -m pipinstall -r requirements.txt . 
      
      -name: Test with PyTest
       run: |
         python -m pytest --cov=inflammation.models test/test_models.py

        